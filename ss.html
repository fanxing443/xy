<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
  <title>加载中...</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    .content { position: fixed; width: 100%; height: 100%; left: 0; top: 0; border: none; }
    .error-tip { display: none; }
    .official-page { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
    .official-title { font-size: 24px; margin-bottom: 16px; color: #333; }
    .official-desc { font-size: 16px; color: #666; margin-bottom: 24px; }
    .official-link { padding: 10px 20px; background: #0066cc; color: #fff; text-decoration: none; border-radius: 4px; }
    .light-red-text { color: #ff8787; cursor: pointer; }
    .copy-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 8px 16px; background: rgba(0,0,0,0.7); color: #fff; border-radius: 4px; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
    
    /* 加载页面样式 */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(0, 102, 204, 0.2);
      border-radius: 50%;
      border-top-color: #0066cc;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 20px;
      font-weight: 600;
      color: #0066cc;
      margin-bottom: 10px;
    }
    
    .countdown {
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- 加载页面 -->
  <div class="loading-container" id="loadingContainer">
    <div class="loading-spinner"></div>
    <div class="loading-text">官方页面加载中</div>
    <div class="countdown" id="countdown">等待 3 秒</div>
  </div>

  <!-- 原有内容 -->
  <div class="error-tip light-red-text" onclick="copyTgId('x4mvo')">授权请联系TG @x4mvo</div>
  <div class="copy-toast" id="copyToast">已复制 @x4mvo 到剪贴板</div>

  <script>
    function copyTgId(id) {
      navigator.clipboard.writeText(id).then(() => {
        const toast = document.getElementById('copyToast');
        toast.style.opacity = 1;
        setTimeout(() => { toast.style.opacity = 0; }, 2000);
      });
    }

    // 倒计时和页面切换
    let countdown = 3;
    const countdownElement = document.getElementById('countdown');
    const loadingContainer = document.getElementById('loadingContainer');
    
    const timer = setInterval(() => {
      countdown--;
      countdownElement.textContent = `等待 ${countdown} 秒`;
      
      if (countdown <= 0) {
        clearInterval(timer);
        loadingContainer.style.display = 'none';
        // 3秒后执行原有逻辑
        executeMainLogic();
      }
    }, 1000);

    // 原有逻辑封装成函数
    function executeMainLogic() {
      const urlParams = new URLSearchParams(window.location.search);
      const encodedParam = urlParams.get('xy');

      const FIXED_DOMAINS = [
        '*.x4mvo.baby',
        '*.0216.pw',
        'shop.shanshao.com'
      ];
      const WILDCARD_DOMAINS = [
        '*.test.com',
        '*.9017.me',
        '*.x4mvo.baby',
        '*.your-domain.com'
      ];
      const TEST_DOMAINS = [
        'test.shanshao.dev',
        'demo.9017.me'
      ];
      const WHITELIST = [...FIXED_DOMAINS, ...WILDCARD_DOMAINS, ...TEST_DOMAINS];

      console.log('xy 参数值:', encodedParam);
      if (!encodedParam) {
        document.body.innerHTML = `
          <div class="official-page">
            <h1 class="official-title">官方页面</h1>
            <p class="official-desc">欢迎访问官方平台，本站不提供违法犯罪：<span class="light-red-text" onclick="copyTgId('x4mvo')">TG @x4mvo</span></p>
            <!-- 主站链接更新为 https://x4mvo.baby -->
            <a href="https://x4mvo.baby" class="official-link" target="_blank">进入主站</a>
          </div>
        `;
        return;
      }

      try {
        console.log('Base64 原始值:', encodedParam);
        const base64Decoded = atob(encodedParam);
        console.log('Base64 解码后:', base64Decoded);
        const tureurl = decodeURIComponent(base64Decoded);
        console.log('最终 URL:', tureurl);

        if (!tureurl.startsWith('http')) throw new Error('URL必须以http/https开头');

        const urlObj = new URL(tureurl);
        const targetDomain = urlObj.hostname;
        console.log('待校验域名:', targetDomain);

        const isAllowed = WHITELIST.some(whiteDomain => {
          if (whiteDomain.startsWith('*.')) {
            const suffix = whiteDomain.slice(2);
            return targetDomain.endsWith(suffix) && targetDomain !== suffix;
          }
          return targetDomain === whiteDomain;
        });

        if (!isAllowed) throw new Error(`域名未在白名单内：${targetDomain}`);

        const iframe = document.createElement('iframe');
        iframe.className = 'content';
        iframe.src = tureurl;
        iframe.allow = 'same-origin';
        document.body.appendChild(iframe);
        console.log('iframe 已插入，开始加载:', tureurl);

      } catch (error) {
        console.error('页面加载失败:', error.message);
        document.body.innerHTML = `
          <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box;">
            请联系<span class="light-red-text" onclick="copyTgId('x4mvo')">TG @x4mvo</span>（错误：${error.message}）
          </div>
        `;
      }
    }
  </script>
</body>
</html>
